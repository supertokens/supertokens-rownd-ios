name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: Skip E2E tests for this release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: 26.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Run package and unit tests
        run: npm run test:pr

  e2e:
    name: E2E
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.skip_e2e)
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: supertokens-rownd-ios

    steps:
      - name: Checkout iOS SDK
        uses: actions/checkout@v4
        with:
          path: supertokens-rownd-ios

      - name: Checkout Rownd Hub
        uses: actions/checkout@v4
        with:
          repository: supertokens/supertokens-rownd-hub
          ref: c6feb9dcac73929e28d0c34ece41981c7e602a2d
          path: supertokens-rownd-hub
          token: ${{ secrets.ROWND_HUB_TOKEN }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: 26.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            supertokens-rownd-ios/package-lock.json
            supertokens-rownd-hub/package-lock.json

      - name: Set up Docker
        uses: douglascamata/setup-docker-macos-action@v1.1.0
        with:
          lima: v1.2.1
          colima: v0.9.1

      - name: Install iOS SDK dependencies
        run: npm ci

      - name: Install Rownd Hub dependencies
        run: npm ci
        working-directory: supertokens-rownd-hub

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Run E2E tests
        run: npm run test:e2e && IOS_E2E_UI_SCRIPT=test:e2e:safari-handoff npm run test:e2e

  release:
    name: Release
    needs: [test, e2e]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: 26.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release history
        run: |
          current_tag="v$(tr -d '[:space:]' < VERSION)"
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -1)"

          if [[ "$current_tag" != "$latest_tag" ]]; then
            echo "VERSION points to $current_tag, but the latest tag is $latest_tag"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$latest_tag" HEAD; then
            echo "$latest_tag is not part of the main branch history"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: npm run release -- --ci
