name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout iOS SDK
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: 26.0.1

      - name: Cache Swift dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.0.1-swiftpm-${{ hashFiles('Package.resolved', 'rownd.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.0.1-swiftpm-

      - name: Resolve Swift dependencies
        run: xcodebuild -resolvePackageDependencies -workspace RowndPackage.xcworkspace -scheme Rownd -clonedSourcePackagesDirPath "$RUNNER_TEMP/swiftpm"

      - name: Run package tests
        run: xcodebuild -workspace RowndPackage.xcworkspace -scheme Rownd -destination 'platform=iOS Simulator,name=iPhone 17' -clonedSourcePackagesDirPath "$RUNNER_TEMP/swiftpm" -skip-testing:RowndIntegrationTests -parallel-testing-enabled NO test

      - name: Run example configuration test
        run: xcodebuild -workspace rownd.xcworkspace -scheme rownd_ios_example -destination 'platform=iOS Simulator,name=iPhone 17' -clonedSourcePackagesDirPath "$RUNNER_TEMP/swiftpm" -only-testing:rownd_ios_exampleTests/RowndExampleTests/testSuperTokensConfigDefaultsToAuthBasePath test

      - name: Run CocoaPods consumer runtime test
        run: npm run test:cocoapods
